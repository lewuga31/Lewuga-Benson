<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Léwuga Benson</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .intro {
            text-align: left;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            background-color: #eaf4ec;
            border-radius: 8px;
            width: fit-content;
        }

        .intro a {
            font-size: 1.2rem;
            color: #2e2e2e;
            padding: 8px 0;
        }

        .cutouts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .cutouts img {
            max-width: 250px;
            height: auto;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .intro {
                padding: 10px;
                gap: 15px;
            }

            .cutouts img {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hook"></div>
        <div class="string-container">
            <div class="string"></div>
        </div>
    </div>

    <div id="cylinder-container"></div>

    <div class="content">
        <div class="intro">
            <h2>Léwuga Tata Benson, Multidisciplinary Artist</h2>
            <a href="artistbio.html">Artist Bio</a>
            <a href="film+video.html">Film + Video</a>
            <a href="installations.html">Installations</a>
            <a href="https://drive.google.com/file/d/1aDjOQMyZa-xksOGfZWpb1EOUbKxG1Oi3/view" target="_blank">CV</a>
        </div>

        <div class="cutouts">
            <img src="riging.png" alt="Oil Rig Cutout">
            <img src="oilrig.png" alt="Rusty Rig Detail">
            <img src="man.png" alt="Man by the Water">
            <img src="water.png" alt="River Silhouette">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const container = document.getElementById('cylinder-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(0, 1, 0).normalize();
        scene.add(directionalLight);

        const loader = new THREE.GLTFLoader();
        loader.load(
            'oil_barrel.glb',
            function (gltf) {
                const model = gltf.scene;
                model.position.set(0, -1.6, 0);
                scene.add(model);
            },
            undefined,
            function (error) {
                console.error(error);
            }
        );

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', function () {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
