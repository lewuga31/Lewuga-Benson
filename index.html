<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Léwuga Benson</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Artistic tree and line visuals */
        .environment {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: -1;
        }

        .tree {
            width: 40px;
            height: 80px;
            background: #4b8f29;
            border-radius: 0 0 50% 50%;
            position: relative;
        }

        .tree::before {
            content: '';
            position: absolute;
            bottom: 80px;
            left: 50%;
            width: 8px;
            height: 40px;
            background: #5b3924;
            transform: translateX(-50%);
        }

        .line {
            height: 2px;
            width: 100%;
            background: #333;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hook"></div>
        <div class="string-container">
            <div class="string"></div>
        </div>
    </div>
    <div id="cylinder-container"></div>
    <div class="content">
        <div class="intro">
            <h2>Léwuga Tata Benson, Multidisciplinary Artist</h2>
            <a href="artistbio.html"><h3 class="me">Artist Bio</h3></a>
            <a href="film+video.html"><h3 class="film">Film + Video</h3></a>
            <a href="installations.html"><h3 class="install">Installations</h3></a>
            <a href="https://drive.google.com/file/d/1aDjOQMyZa-xksOGfZWpb1EOUbKxG1Oi3/view" target="_blank">CV</a>
        </div>
    </div>

    <div class="environment">
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
    </div>
    <div class="line"></div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Three.js Setup -->
    <script>
        const container = document.getElementById('cylinder-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(0, 1, 0).normalize();
        scene.add(directionalLight);

        const loader = new THREE.GLTFLoader();
        loader.load(
            'oil_barrel.glb',
            function (gltf) {
                const model = gltf.scene;
                model.position.set(0, -1.6, 0);
                scene.add(model);
            },
            undefined,
            function (error) {
                console.error(error);
            }
        );

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', function () {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
