<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film + Video</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    :root{
      --bg:#111;
      --fg:#f0f0f0;
      --ui: rgba(0,0,0,.55);
      --ui2: rgba(255,255,255,.15);
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: Arial, sans-serif;
      overflow:hidden; 
    }

   
    .carousel{
      position:relative;
      width:100vw;
      height:100vh;
      background:#000;
    }

    .slide-link{
      position:absolute;
      inset:0;
      display:block;
      text-decoration:none;
      color:inherit;
    }

    .slide-media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover; 
      filter: none;
      transform: scale(1.02); 
    }

  
    .vignette{
      position:absolute;
      inset:0;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
        linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 40%);
      pointer-events:none;
    }


    .film-label{
      position:absolute;
      left:24px;
      bottom:20px;
      background:var(--ui);
      border:1px solid rgba(255,255,255,.12);
      padding:10px 12px;
      border-radius:8px;
      max-width:min(70vw, 560px);
      line-height:1.2;
      letter-spacing:.5px;
      text-transform:uppercase;
      font-size:13px;
    }

    .film-label .title{
      display:block;
      font-weight:700;
      margin-bottom:4px;
    }
    .film-label .meta{
      opacity:.9;
      font-size:12px;
      text-transform:none;
      letter-spacing:0;
    }


    .nav-btn{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:48px;
      height:48px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.18);
      background:var(--ui);
      color:var(--fg);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      user-select:none;
      z-index:5;
    }
    .nav-btn:hover{
      background:rgba(0,0,0,.75);
      border-color: rgba(255,255,255,.28);
    }
    .nav-btn:active{
      transform:translateY(-50%) scale(.98);
    }
    .nav-prev{ left:16px; }
    .nav-next{ right:16px; }

  
    .page-tag{
      position:absolute;
      top:16px;
      left:16px;
      background:var(--ui);
      border:1px solid rgba(255,255,255,.12);
      padding:10px 12px;
      border-radius:10px;
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      z-index:6;
    }

 
    .fade{
      opacity:0;
      transition: opacity 400ms ease;
    }
    .fade.show{
      opacity:1;
    }


    @media (max-width: 600px){
      .film-label{ left:14px; right:14px; bottom:14px; }
      .nav-btn{ width:44px; height:44px; }
      .nav-prev{ left:10px; }
      .nav-next{ right:10px; }
    }
  </style>
</head>

<body>
  <div class="carousel" id="carousel">
    <div class="page-tag">Film + Video</div>

    <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous film">‹</button>
    <button class="nav-btn nav-next" id="nextBtn" aria-label="Next film">›</button>

    <!-- Clickable slide -->
    <a class="slide-link" id="slideLink" href="#">
      <img class="slide-media fade" id="slideImg" alt="" />
      <div class="vignette"></div>

      <div class="film-label" id="filmLabel">
        <span class="title" id="filmTitle">—</span>
        <span class="meta" id="filmMeta">—</span>
      </div>
    </a>
  </div>

  <script>
  
    const films = [
      {
        title: "The Places I Know",
        year: "2021",
        cover: "stills/the places I know.png",
        href: "theplacesiknow.html",
        meta: "Film • 2021"
      },
      {
        title: "This Mutt",
        year: "2020",
        cover: "stills/This mutt.png",
        href: "thismutt.html",
        meta: "Film • 2020"
      },
      {
        title: "Time to Leave",
        year: "2019",
        cover: "stills/timetoleave.png",
        href: "timetoleave.html",
        meta: "Film • 2019"
      },
      {
        title: "The Jump",
        year: "2017",
        cover: "stills/The Jump.png",
        href: "thejump.html",
        meta: "Film • 2017"
      },
      {
        title: "16mm",
        year: "2020",
        cover: "stills/16mm.png",
        href: "16mm.html",
        meta: "Film • 2020"
      },
      {
        title: "Home",
        year: "2020",
        cover: "stills/home.png",
        href: "home.html",
        meta: "Film • 2020"
      },
      {
        title: "Vacation",
        year: "2019",
        cover: "stills/vacation.png",
        href: "vacation.html",
        meta: "Film • 2019"
      },
      {
        title: "Meshes of the Afternoon (re-creation)",
        year: "2019",
        cover: "stills/meshes of the afternoon.png",
        href: "meshesoftheafternoon.html",
        meta: "Study / Re-creation • 2019"
      },
      {
        title: "UB Debate Society",
        year: "2019",
        cover: "stills/UB Debate Society.png",
        href: "ubdebatesociety.html",
        meta: "Doc • 2019"
      }
    ];

   
    const slideImg = document.getElementById("slideImg");
    const slideLink = document.getElementById("slideLink");
    const filmTitle = document.getElementById("filmTitle");
    const filmMeta = document.getElementById("filmMeta");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let index = 0;
    let timer = null;
    const INTERVAL_MS = 5000;

    function render(i){
      const f = films[i];

      
      slideImg.classList.remove("show");

     
      window.setTimeout(() => {
        slideImg.src = f.cover;
        slideImg.alt = `${f.title} (${f.year}) cover image`;
        slideLink.href = f.href;
        filmTitle.textContent = f.title;
        filmMeta.textContent = f.meta;

      
        slideImg.classList.add("show");
      }, 120);
    }

    function next(){
      index = (index + 1) % films.length;
      render(index);
      restartTimer();
    }

    function prev(){
      index = (index - 1 + films.length) % films.length;
      render(index);
      restartTimer();
    }

    function restartTimer(){
      if(timer) window.clearInterval(timer);
      timer = window.setInterval(() => {
        index = (index + 1) % films.length;
        render(index);
      }, INTERVAL_MS);
    }

    prevBtn.addEventListener("click", prev);
    nextBtn.addEventListener("click", next);

    
    window.addEventListener("keydown", (e) => {
      if(e.key === "ArrowLeft") prev();
      if(e.key === "ArrowRight") next();
    });


    render(index);
    restartTimer();
  </script>
</body>
</html>
