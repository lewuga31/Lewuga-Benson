<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16mm</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      background-color: #111;
      color: #f0f0f0;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .film-details {
      padding: 40px 20px 20px;
    }

    .film-details h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .film-details p {
      margin: 5px 0;
      font-size: 1.1rem;
      color: #ccc;
    }

    .film-video {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px auto 80px;
      max-width: 100%;
    }

    .film-video iframe {
      width: 90vw;
      height: 50vw;
      max-width: 1280px;
      max-height: 720px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="film-details">
    <h1>16mm</h1>
    <p>Directed and Edited by Léwuga Tata Benson</p>
    <p>2020</p>
  </div>

  <div class="film-video">
